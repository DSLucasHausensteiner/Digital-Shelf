[project]
name = "digital-shelf"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "opencv-python>=4.12.0.88",
  "paddleocr>=3.3.0",
  "psycopg2>=2.9.10",
  "requests>=2.32.5",
  "sqlalchemy>=2.0.43",
  "streamlit>=1.50.0",
  "paddlepaddle-gpu==3.2.0",
]

[dependency-groups]
dev = [
  "black>=25.9.0",
  "ipykernel>=7.0.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# --- uv index config ---
# Make PyPI the default for everything:
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# Add the Paddle CUDA 12.9 wheels as an *explicit* index
# (only used when we say so below):
[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-gpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-gpu" }
